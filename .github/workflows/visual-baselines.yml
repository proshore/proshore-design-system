name: Visual baselines
# Run by hand (Actions tab > Visual baselines > Run workflow) after an intended visual change.
# It regenerates the Linux screenshots that CI compares against and commits them to the branch it ran on.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baselines:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual:update
      - name: Commit the Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/*/e2e/visual-baselines/linux
          git diff --cached --quiet && { echo "No visual changes"; exit 0; }
          git commit -m "Update Linux visual baselines"
          git push
