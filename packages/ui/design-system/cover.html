<!-- @dsCard height=288 -->
<style>
html,body{margin:0;background:var(--pr-canvas)}
.wrap{width:960px;height:288px}
.ground{fill:var(--pr-canvas)}
.b1{fill:var(--pr-lapis-light)} .b2{fill:var(--pr-clear-blue)} .b3{fill:var(--pr-lapis-lighter)} .b4{fill:var(--pr-marigold)} .b5{fill:var(--pr-clear-blue-lighter)}
.name{font:600 88px/0.95 var(--default-font-family);letter-spacing:-0.03em;fill:var(--gray-12)}
.tag{font:400 14px var(--default-font-family);fill:var(--gray-11)}
</style>
<div class="wrap"><svg width="960" height="288" viewBox="0 0 960 288" role="img" aria-label="Proshore design system cover">
<!-- derivation
blocks: pr-lapis-light 200x160 slab, pr-clear-blue 120x120, pr-lapis-lighter 160x64, pr-marigold 64x64 disc, pr-clear-blue-lighter 96x48.
arrangement: one tall slab with staggered satellites, bleeding off the right edge.
pattern: pills (soft, pill buttons, radius-full): a stack of 5 pills at one 8px (space-2) gap, half-height rx. Chosen because the system's buttons and nav are pills.
steps/radii: space-2 gap 8px, space-4 16px, space-6 32px; slab radius-2 8px; pills rx = half the short side.
-->
<rect class="ground" width="960" height="288"/>
<rect class="b1" x="496" y="32" width="200" height="224" rx="8"/>
<rect class="b2" x="712" y="32" width="120" height="120" rx="8"/>
<circle class="b4" cx="864" cy="64" r="32"/>
<rect class="b3" x="712" y="168" width="160" height="32" rx="16"/>
<rect class="b5" x="712" y="208" width="248" height="32" rx="16"/>
<rect class="b3" x="880" y="168" width="80" height="32" rx="16"/>
<rect class="b5" x="840" y="128" width="120" height="24" rx="12"/>
<text class="name" x="32" y="200">Proshore</text>
<text class="tag" x="34" y="232">Tokens, components and guidelines for Proshore products.</text>
</svg></div>
